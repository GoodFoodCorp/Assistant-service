services:
  assistant-service:
    build: .
    container_name: assistant-service
    restart: unless-stopped
    ports:
      - "8093:8093"
    env_file:
      - .env
    environment:
      ORDER_SERVICE_URL: http://order-service:8082
      MENU_SERVICE_URL: http://menu-service:8085
    extra_hosts:
      # Lets the container reach a locally-run AI runtime (e.g. Ollama) on
      # the host via AI_BASE_URL=http://host.docker.internal:PORT — resolves
      # automatically on Docker Desktop (Mac/Windows), explicit here so it
      # also works on Linux.
      - "host.docker.internal:host-gateway"
    networks:
      - microservices-net

networks:
  microservices-net:
    external: true
